<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>opium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital@1&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --vh: 1vh;
            --tog-w: clamp(36px, 5vw, 44px);
            --tog-h: clamp(20px, 2.8vw, 24px);
            --accent: #8b7cf6;
            --accent-bright: #a78bfa;
            --accent-dim: #6d5cd6;
            --accent-glow: rgba(139, 124, 246, 0.35);
        }

        body {
            height: calc(var(--vh) * 100);
            overflow: hidden;
            background: #080810;
            font-family: 'Inter', sans-serif;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        canvas#stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 0 clamp(16px, 4vw, 32px);
        }

        .wordmark {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: clamp(64px, 11vw, 100px);
            font-weight: 400;
            background: linear-gradient(135deg, #fff 40%, var(--accent-bright) 130%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.01em;
            margin-bottom: clamp(10px, 1.6vw, 16px);
            user-select: none;
        }

        .tagline {
            font-family: 'Playfair Display', serif;
            font-style: normal;
            font-size: clamp(13px, 1.5vw, 17px);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: clamp(26px, 3.2vw, 36px);
            letter-spacing: 0.01em;
            user-select: none;
        }

        .tagline a {
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        .tagline a:hover {
            color: #fff;
        }

        .search-wrap {
            position: relative;
            width: min(480px, 100%);
            transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .search-wrap.expanded {
            width: min(620px, 100%);
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: clamp(8px, 1.5vw, 12px);
            padding: 0 clamp(10px, 2vw, 16px);
            width: 100%;
            gap: clamp(6px, 1.2vw, 10px);
            transition: border-color 0.2s, background 0.2s;
        }

        .search-wrap.expanded .search-bar {
            border-color: var(--accent-dim);
            background: rgba(255, 255, 255, 0.06);
            border-radius: clamp(8px, 1.5vw, 12px);
        }

        .search-wrap.expanded.has-ac .search-bar {
            border-radius: clamp(8px, 1.5vw, 12px) clamp(8px, 1.5vw, 12px) 0 0;
        }

        .search-bar svg {
            width: 14px;
            height: 14px;
            stroke: rgba(255,255,255,0.35);
            fill: none;
            stroke-width: 2;
            flex-shrink: 0;
            transition: stroke 0.2s;
        }

        .search-wrap.expanded .search-bar svg {
            stroke: var(--accent-bright);
        }

        .search-bar input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: clamp(12px, 1.6vw, 14px);
            font-weight: 300;
            color: #e6e6e6;
            padding: clamp(10px, 1.8vw, 13px) 0;
        }

        .search-bar input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .autocomplete {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            background: rgba(12, 12, 20, 0.99);
            border: 1px solid var(--accent-dim);
            border-top: none;
            border-radius: 0 0 clamp(8px, 1.5vw, 12px) clamp(8px, 1.5vw, 12px);
            overflow: hidden;
            z-index: 10;
        }

        .search-wrap.expanded .autocomplete.has-items {
            display: block;
        }

        .ac-item {
            padding: clamp(9px, 1.6vw, 12px) clamp(10px, 2vw, 16px);
            font-size: clamp(12px, 1.5vw, 14px);
            font-weight: 300;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.1s, color 0.1s;
        }

        .ac-item:last-child {
            border-bottom: none;
        }

        .ac-item:hover,
        .ac-item.selected {
            background: rgba(139, 124, 246, 0.12);
            color: #fff;
        }

        .ac-item svg {
            width: 11px;
            height: 11px;
            stroke: rgba(255,255,255,0.4);
            fill: none;
            stroke-width: 2;
            flex-shrink: 0;
        }

        .shortcuts {
            margin-top: clamp(10px, 2vw, 16px);
            display: flex;
            gap: clamp(6px, 1.2vw, 10px);
            flex-wrap: wrap;
            justify-content: center;
            width: min(480px, 100%);
        }

        .shortcut {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(5px, 1vw, 7px);
            width: clamp(60px, 13vw, 74px);
            padding: clamp(10px, 2vw, 14px) clamp(6px, 1vw, 10px) clamp(8px, 1.5vw, 11px);
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.11);
            border-radius: clamp(8px, 1.5vw, 12px);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, transform 0.15s;
        }

        .shortcut:hover {
            background: rgba(139, 124, 246, 0.1);
            border-color: var(--accent-dim);
            transform: translateY(-2px);
        }

        .shortcut-icon {
            width: clamp(26px, 5vw, 32px);
            height: clamp(26px, 5vw, 32px);
            border-radius: clamp(6px, 1vw, 8px);
            object-fit: contain;
            display: block;
            transition: transform 0.15s;
        }

        .shortcut:hover .shortcut-icon {
            transform: translateY(-1px);
        }

        .shortcut span {
            font-size: clamp(10px, 1.2vw, 12px);
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
            text-align: center;
            width: 100%;
            transition: color 0.15s;
        }

        .shortcut:hover span {
            color: #fff;
        }

        .panel {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            background: #111;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .panel.open {
            transform: translateY(0);
        }

        .panel-bar-wrap {
            display: flex;
            background: #141414;
            border-bottom: 1px solid #1e1e1e;
            flex-shrink: 0;
            padding: clamp(6px, 1.2vw, 9px) clamp(8px, 1.5vw, 12px);
        }
        .panel-bar {
            display: flex;
            align-items: center;
            gap: clamp(4px, 1vw, 6px);
            width: 100%;
        }
        .nav-btn-group {
            display: flex;
            align-items: center;
            gap: 0;
            flex-shrink: 0;
        }

        .nb {
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255,255,255,0.4);
            padding: clamp(4px, 0.8vw, 6px);
            border-radius: 5px;
            display: flex;
            align-items: center;
            transition: color 0.15s;
            flex-shrink: 0;
        }

        .nb:hover {
            color: rgba(255,255,255,0.9);
        }

        .nb svg {
            width: clamp(12px, 1.8vw, 14px);
            height: clamp(12px, 1.8vw, 14px);
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            display: block;
        }

        .home-btn.confirm {
            color: #e05555 !important;
            animation: homePulse 0.6s ease-in-out infinite alternate;
        }

        @keyframes homePulse {
            from { color: #e05555; }
            to   { color: #ff8888; }
        }

        .home-confirm-hint {
            position: absolute;
            top: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%) translateY(-4px);
            white-space: nowrap;
            font-size: clamp(10px, 1.2vw, 11px);
            letter-spacing: 0.06em;
            color: #e05555;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.18s, transform 0.18s;
            font-weight: 400;
            background: rgba(20, 20, 20, 0.92);
            border: 1px solid rgba(224, 85, 85, 0.3);
            border-radius: 5px;
            padding: 3px 8px;
            z-index: 200;
        }

        .home-btn-wrap {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            z-index: 1;
        }

        .home-btn-wrap.confirming .home-confirm-hint {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .home-countdown {
            position: absolute;
            bottom: 0;
            left: 2px;
            right: 2px;
            height: 2px;
            background: #e05555;
            border-radius: 2px;
            transform-origin: left;
            transform: scaleX(0);
            opacity: 0;
            transition: opacity 0.15s;
        }

        .home-btn-wrap.confirming .home-countdown {
            opacity: 1;
            transform: scaleX(1);
            animation: homeCountdown 5s linear forwards;
        }

        @keyframes homeCountdown {
            from { transform: scaleX(1); }
            to   { transform: scaleX(0); }
        }

        .addr-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            gap: clamp(4px, 0.8vw, 6px);
            background: #1a1a1a;
            border: 1px solid #252525;
            border-radius: clamp(5px, 1vw, 7px);
            padding: 0 clamp(8px, 1.5vw, 12px);
            min-width: 0;
        }

        .addr-wrap:focus-within {
            border-color: #333;
        }

        .lock-icon {
            width: clamp(10px, 1.3vw, 12px);
            height: clamp(10px, 1.3vw, 12px);
            stroke: rgba(255,255,255,0.25);
            fill: none;
            stroke-width: 2;
            flex-shrink: 0;
            transition: stroke 0.2s;
        }

        .lock-icon.secure {
            stroke: #4caf7d;
        }

        .addr-sep {
            color: rgba(255,255,255,0.18);
            font-size: clamp(10px, 1.2vw, 12px);
            flex-shrink: 0;
            user-select: none;
            line-height: 1;
        }

        .addr-input {
            flex: 1;
            background: none;
            border: none;
            padding: clamp(5px, 1vw, 7px) 0;
            font-family: inherit;
            font-size: clamp(11px, 1.4vw, 13px);
            color: rgba(255,255,255,0.55);
            outline: none;
            min-width: 0;
        }

        .addr-wrap:focus-within .addr-input {
            color: #ccc;
        }

        .panel iframe {
            flex: 1;
            border: none;
            background: #111;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            background: rgba(8, 8, 16, 0.97);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            padding: 0 clamp(12px, 2vw, 24px);
        }

        .bottom-nav.hidden {
            transform: translateY(100%);
        }

        .nav-stats {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
            padding: clamp(8px, 1.5vw, 11px) 0 clamp(10px, 1.8vw, 13px);
            flex-shrink: 0;
        }

        .nav-stat {
            font-size: clamp(8px, 0.9vw, 10px);
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.06em;
            font-weight: 300;
            white-space: nowrap;
        }

        .nav-stat a {
            color: inherit;
            text-decoration: none;
        }

        .nav-stat a:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .nav-buttons {
            display: flex;
            align-items: center;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(3px, 0.8vw, 5px);
            padding: clamp(8px, 1.5vw, 11px) clamp(10px, 1.5vw, 18px) clamp(10px, 1.8vw, 13px);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.55);
            font-family: inherit;
            font-size: clamp(9px, 1vw, 10px);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.15s;
            position: relative;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 50%;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent-bright);
            opacity: 0;
            transform: translateX(-50%) scale(0.4);
            transition: opacity 0.2s, transform 0.2s;
        }

        .nav-item:hover {
            color: #fff;
        }

        .nav-item.active {
            color: var(--accent-bright);
        }

        .nav-item.active::before {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .nav-item svg {
            width: clamp(14px, 2.2vw, 17px);
            height: clamp(14px, 2.2vw, 17px);
            stroke: currentColor;
            fill: none;
            stroke-width: 1.6;
        }

        .settings-screen {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .settings-screen.open {
            opacity: 1;
            pointer-events: all;
        }

        .settings-inner {
            width: min(720px, 92vw);
            height: min(560px, 85vh);
            background: #09090f;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: translateY(16px) scale(0.98);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 32px 80px rgba(0,0,0,0.6);
        }

        .settings-screen.open .settings-inner {
            transform: translateY(0) scale(1);
        }

        .screen-header {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: clamp(10px, 1.8vw, 16px);
            padding: clamp(8px, 1.2vw, 10px) clamp(12px, 2vw, 20px) clamp(8px, 1.2vw, 10px) clamp(12px, 2vw, 20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }

        .settings-inner .screen-header {
            padding-left: 0;
        }

        .screen-header-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex-shrink: 0;
        }

        .settings-inner .screen-header-left {
            width: clamp(130px, 18vw, 190px);
            padding-left: clamp(14px, 2vw, 22px);
        }

        .screen-header-title {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: clamp(18px, 2.6vw, 24px);
            color: #fff;
            line-height: 1;
            user-select: none;
            cursor: default;
        }

        .screen-header-sub {
            font-size: clamp(8px, 1vw, 10px);
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 400;
        }

        .screen-minimize-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.4);
            padding: clamp(8px, 1.4vw, 12px) clamp(14px, 2.5vw, 22px);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s, background 0.15s;
            flex-shrink: 0;
            min-width: clamp(44px, 7vw, 64px);
            min-height: clamp(36px, 5vw, 44px);
        }

        .screen-minimize-btn:hover {
            color: rgba(255, 255, 255, 0.65);
            background: rgba(255, 255, 255, 0.05);
        }

        .screen-minimize-btn svg {
            width: clamp(18px, 2.4vw, 22px);
            height: clamp(18px, 2.4vw, 22px);
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            display: block;
        }

        .settings-body {
            flex: 1;
            display: flex;
            overflow: hidden;
            min-height: 0;
        }

        .settings-sidebar {
            width: clamp(130px, 18vw, 190px);
            flex-shrink: 0;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            overflow-y: auto;
            padding: clamp(10px, 1.5vw, 16px) 0;
        }

        .settings-sidebar::-webkit-scrollbar {
            display: none;
        }

        .sidebar-item {
            padding: clamp(7px, 1.1vw, 10px) clamp(14px, 2vw, 22px);
            font-size: clamp(11px, 1.4vw, 13px);
            font-weight: 400;
            color: rgba(255,255,255,0.45);
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
            letter-spacing: 0.04em;
            border-left: 2px solid transparent;
        }

        .sidebar-item:hover {
            color: rgba(255,255,255,0.8);
        }

        .sidebar-item.active {
            color: #fff;
            border-left-color: var(--accent-bright);
            background: rgba(139, 124, 246, 0.1);
        }

        .settings-tabs {
            display: none;
            overflow-x: auto;
            flex-shrink: 0;
            padding: clamp(10px, 2vw, 14px) clamp(14px, 3vw, 22px);
            gap: clamp(6px, 1.5vw, 9px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            scrollbar-width: none;
        }

        .settings-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-item {
            flex-shrink: 0;
            padding: clamp(6px, 1.2vw, 9px) clamp(12px, 2.2vw, 18px);
            font-size: clamp(10px, 1.3vw, 12px);
            font-weight: 400;
            color: rgba(255,255,255,0.45);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            background: transparent;
            font-family: inherit;
            letter-spacing: 0.05em;
            transition: all 0.18s;
            white-space: nowrap;
        }

        .tab-item:hover {
            color: rgba(255,255,255,0.8);
            border-color: var(--accent-dim);
        }

        .tab-item.active {
            color: #fff;
            border-color: var(--accent);
            background: rgba(139, 124, 246, 0.16);
        }

        .settings-panels {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            scrollbar-width: thin;
            scrollbar-color: #1a1a28 transparent;
        }

        .settings-panels::-webkit-scrollbar {
            width: 3px;
        }

        .settings-panels::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        .settings-panel-section {
            padding: clamp(16px, 2.5vw, 26px) clamp(18px, 3vw, 36px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .settings-panel-section:last-child {
            border-bottom: none;
        }

        .settings-spacer {
            height: 20vh;
        }

        .category-label {
            font-size: clamp(10px, 1.2vw, 12px);
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: clamp(10px, 1.5vw, 16px);
        }

        .category-rows {
            display: flex;
            flex-direction: column;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(10px, 1.5vw, 14px) 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .category-rows .setting-row:last-child {
            border-bottom: none;
        }

        .setting-label {
            font-size: clamp(14px, 2vw, 17px);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: -0.01em;
        }

        .toggle {
            width: var(--tog-w);
            height: var(--tog-h);
            border-radius: calc(var(--tog-h));
            background: rgba(255, 255, 255, 0.12);
            position: relative;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.16);
            transition: background 0.22s, border-color 0.22s;
            flex-shrink: 0;
        }

        .toggle:hover {
            border-color: rgba(255, 255, 255, 0.28);
        }

        .toggle.on {
            background: var(--accent);
            border-color: var(--accent);
        }

        .toggle.on:hover {
            background: var(--accent-bright);
            border-color: var(--accent-bright);
        }

        .toggle::after {
            content: '';
            position: absolute;
            top: calc(50% - var(--tog-h) * 0.3);
            left: calc(var(--tog-h) * 0.15);
            width: calc(var(--tog-h) * 0.6);
            height: calc(var(--tog-h) * 0.6);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.55);
            transition: left 0.22s cubic-bezier(0.22, 1, 0.36, 1), background 0.22s;
        }

        .toggle.on::after {
            left: calc(var(--tog-w) - var(--tog-h) * 0.75);
            background: #fff;
        }

        .setting-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);

            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1), transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .ext-prompt-name {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: clamp(16px, 2vw, 18px);
            background: linear-gradient(135deg, #fff 30%, var(--accent-bright) 140%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.01em;
            margin-bottom: 4px;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1), transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .ext-prompt-question {
            font-size: clamp(12px, 1.4vw, 13px);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: 14px;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1), transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .ext-prompt.open .ext-prompt-eyebrow { opacity: 1; transform: translateY(0); transition-delay: 0.06s; }
        .ext-prompt.open .ext-prompt-name { opacity: 1; transform: translateY(0); transition-delay: 0.11s; }
        .ext-prompt.open .ext-prompt-question { opacity: 1; transform: translateY(0); transition-delay: 0.16s; }
        .ext-prompt.open .ext-prompt-btns { opacity: 1; transform: translateY(0); transition-delay: 0.21s; }

        .ext-prompt-btns {
            display: flex;
            gap: 8px;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1), transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .ext-prompt-btn {
            flex: 1;
            padding: clamp(7px, 1.2vw, 9px) 0;
            border-radius: clamp(6px, 1vw, 8px);
            font-family: inherit;
            font-size: clamp(12px, 1.4vw, 13px);
            font-weight: 400;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.12s;
        }

        .ext-prompt-btn:active {
            transform: scale(0.94);
        }

        .ext-prompt-btn.yes {
            background: var(--accent-glow);
            border-color: rgba(139, 124, 246, 0.4);
            color: #fff;
        }

        .ext-prompt-btn.yes:hover {
            background: rgba(139, 124, 246, 0.5);
            border-color: var(--accent-bright);
        }

        .ext-prompt-btn.no {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .ext-prompt-btn.no:hover {
            background: rgba(255, 255, 255, 0.09);
            color: #fff;
        }
    </style>
</head>

<body>
    <canvas id="stars"></canvas>

    <div class="content">
        <div class="wordmark">opium</div>
        <div class="tagline" id="tagline"></div>
        <div class="search-wrap" id="searchWrap">
            <div class="search-bar">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.35-4.35" />
                </svg>
                <input id="searchInput" type="text" placeholder="Search or enter address" autocomplete="off" />
            </div>
            <div class="autocomplete" id="autocomplete"></div>
        </div>
        <div class="shortcuts" id="shortcuts"></div>
    </div>

    <div class="panel" id="panel">
        <div class="panel-bar-wrap">
        <div class="panel-bar">
            <div class="nav-btn-group">
                <div class="home-btn-wrap" id="homeBtnWrap">
                    <button class="nb home-btn" id="homeBtn" onclick="handleHome()">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z" />
                            <path d="M9 21V12h6v9" />
                        </svg>
                    </button>
                    <span class="home-confirm-hint">close?</span>
                    <div class="home-countdown" id="homeCountdown"></div>
                </div>
                <button class="nb" onclick="goBack()"><svg viewBox="0 0 24 24">
                        <path d="m12 19-7-7 7-7" />
                        <path d="M19 12H5" />
                    </svg></button>
                <button class="nb" onclick="goForward()"><svg viewBox="0 0 24 24">
                        <path d="M5 12h14" />
                        <path d="m12 5 7 7-7 7" />
                    </svg></button>
                <button class="nb" onclick="reload()"><svg viewBox="0 0 24 24">
                        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
                        <path d="M21 3v5h-5" />
                    </svg></button>
            </div>
            <div class="addr-wrap">
                <svg class="lock-icon" id="lockIcon" viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <span class="addr-sep">|</span>
                <input class="addr-input" id="addrInput" type="text" placeholder="Search or enter address" />
            </div>
            <button class="nb" onclick="toggleFullscreen()">
                <svg id="fsIcon" viewBox="0 0 24 24">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3" />
                </svg>
            </button>
        </div>
        </div>
        <iframe id="frame" src="about:blank"></iframe>
    </div>

    <div class="settings-screen" id="settingsScreen" onclick="if (event.target === event.currentTarget) toggleSettings()">
        <div class="settings-inner">
        <div class="screen-header">
            <div class="screen-header-left" onclick="toggleSettings()" style="cursor:default">
                <span class="screen-header-title">opium</span>
                <span class="screen-header-sub">settings</span>
            </div>
            <button class="screen-minimize-btn" onclick="toggleSettings()" style="margin-left:auto">
                <svg viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"/></svg>
            </button>
        </div>
        <div class="settings-body">
            <div class="settings-sidebar" id="settingsSidebar"></div>
            <div class="settings-tabs" id="settingsTabs"></div>
            <div class="settings-panels" id="settingsPanels"></div>
        </div>
        </div>
    </div>

    <div class="game-player" id="gamePlayer">
        <div class="game-player-bar-wrap">
            <div class="game-player-bar">
                <div class="game-player-close-wrap" id="gamePlayerCloseWrap">
                    <button class="game-player-close" id="gamePlayerClose" onclick="handleGamePlayerClose()">
                        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                    <span class="game-close-confirm-hint">close?</span>
                    <div class="game-close-countdown" id="gameCloseCountdown"></div>
                </div>
                <div class="game-player-id">
                    <svg class="lock-icon secure" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <span class="addr-sep">|</span>
                    <span class="game-player-id-text" id="gamePlayerId"></span>
                </div>
                <button class="nb" id="gamePlayerFs" onclick="toggleGameFullscreen()">
                    <svg id="gamePlayerFsIcon" viewBox="0 0 24 24">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="game-player-loading" id="gamePlayerLoading">loading…</div>
        <iframe id="gameFrame" allow="autoplay; fullscreen; pointer-lock; gamepad" style="display:none;flex:1;border:none;outline:none;background:#000"></iframe>
    </div>

    <div class="games-screen" id="gamesScreen">
        <div class="screen-header">
            <div class="screen-header-left" onclick="closeGames()" style="cursor:default">
                <span class="screen-header-title">opium</span>
                <span class="screen-header-sub">games</span>
            </div>
            <div class="games-search-bar">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.35-4.35" />
                </svg>
                <input class="games-search-input" id="gamesSearch" type="text" placeholder="Search games…" autocomplete="off" />
                <span class="games-search-count" id="gamesCount"></span>
            </div>
            <button class="screen-minimize-btn" onclick="closeGames()">
                <svg viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"/></svg>
            </button>
        </div>
        <div class="games-grid-wrap" id="gamesGridWrap">
            <div class="games-grid" id="gamesGrid"></div>
        </div>
    </div>

    <div class="effects-screen" id="effectsScreen">
        <div class="screen-header">
            <div class="screen-header-left" onclick="closeEffects()" style="cursor:pointer">
                <span class="screen-header-title">opium</span>
                <span class="screen-header-sub">effects</span>
            </div>
            <div class="effects-search-bar">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.35-4.35" />
                </svg>
                <input class="effects-search-input" id="effectsSearch" type="text" placeholder="Search sound effects…" autocomplete="off" />
            </div>
            <button class="screen-minimize-btn" onclick="closeEffects()">
                <svg viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"/></svg>
            </button>
        </div>
        <div class="effects-grid-wrap" id="effectsGrid"></div>
        <div class="effects-footer">
            <svg viewBox="0 0 24 24">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
            </svg>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="1" />
        </div>
    </div>

    <nav class="bottom-nav" id="bottomNav">
        <div class="nav-stats">
            <span class="nav-stat">&copy; opium.best</span>

            </button>

                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />

            </button>
            <button class="nav-item" id="navSettings" onclick="toggleSettings()">
                <svg viewBox="0 0 24 24">

                    <circle cx="12" cy="12" r="3" />
                </svg>

            </button>
        </div>
    </nav>
